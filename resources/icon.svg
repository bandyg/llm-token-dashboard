<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2D7FF9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- 仪表轨道：135° 起 270° 扫到 45°，底部留缺口 -->
  <path d="M 72.85 193.15 A 78 78 0 1 1 183.15 193.15"
        fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="20" stroke-linecap="round"/>
  <!-- 已用量进度弧（约 72%） -->
  <path d="M 72.85 193.15 A 78 78 0 1 1 195.14 98.29"
        fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round"/>
  <!-- 指针 + 轴心 -->
  <line x1="128" y1="138" x2="171" y2="112.5" stroke="#F9FAFB" stroke-width="10" stroke-linecap="round"/>
  <circle cx="128" cy="138" r="13" fill="#F9FAFB"/>
  <circle cx="128" cy="138" r="4.5" fill="#0F172A"/>
</svg>
